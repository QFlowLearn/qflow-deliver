name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build applications
        run: pnpm build:web && pnpm build:worker

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test delivery in Chromium
        run: pnpm test:e2e:delivery

      - name: Test staff permissions with production authorization
        run: pnpm test:e2e:staff
