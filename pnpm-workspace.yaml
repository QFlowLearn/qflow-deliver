packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"

engineStrict: true
minimumReleaseAge: 10080
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

minimumReleaseAgeExclude:
  - "@longsightgroup/lti-tool"
  - "@longsightgroup/oneroster"
  - "@longsightgroup/qti3-*"

  # Coordinated dependencies for the requested typed Cloudflare configuration.
  - cf
  - "@cloudflare/config"
  - "@cloudflare/build-output-utils"
  - "@cloudflare/runtime-types"
  - "@cloudflare/workers-types"
  - "@cloudflare/vite-plugin"
  - "@cloudflare/vitest-plugin"
  - miniflare
  - workerd
  - "@cloudflare/workerd-*"

  # Exact current tooling releases reviewed for this upgrade.
  - "@oxfmt/binding-android-arm-eabi@0.79.0"
  - "@oxfmt/binding-android-arm64@0.79.0"
  - "@oxfmt/binding-darwin-arm64@0.79.0"
  - "@oxfmt/binding-darwin-x64@0.79.0"
  - "@oxfmt/binding-freebsd-x64@0.79.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.79.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.79.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.79.0"
  - "@oxfmt/binding-linux-arm64-musl@0.79.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.79.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.79.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.79.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.79.0"
  - "@oxfmt/binding-linux-x64-gnu@0.79.0"
  - "@oxfmt/binding-linux-x64-musl@0.79.0"
  - "@oxfmt/binding-openharmony-arm64@0.79.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.79.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.79.0"
  - "@oxfmt/binding-win32-x64-msvc@0.79.0"
  - "@oxlint/binding-android-arm-eabi@1.94.0"
  - "@oxlint/binding-android-arm64@1.94.0"
  - "@oxlint/binding-darwin-arm64@1.94.0"
  - "@oxlint/binding-darwin-x64@1.94.0"
  - "@oxlint/binding-freebsd-x64@1.94.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.94.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.94.0"
  - "@oxlint/binding-linux-arm64-gnu@1.94.0"
  - "@oxlint/binding-linux-arm64-musl@1.94.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.94.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.94.0"
  - "@oxlint/binding-linux-riscv64-musl@1.94.0"
  - "@oxlint/binding-linux-s390x-gnu@1.94.0"
  - "@oxlint/binding-linux-x64-gnu@1.94.0"
  - "@oxlint/binding-linux-x64-musl@1.94.0"
  - "@oxlint/binding-openharmony-arm64@1.94.0"
  - "@oxlint/binding-win32-arm64-msvc@1.94.0"
  - "@oxlint/binding-win32-ia32-msvc@1.94.0"
  - "@oxlint/binding-win32-x64-msvc@1.94.0"
  - "@playwright/test@1.65.1"
  - "axe-core@4.14.1"
  - "oxfmt@0.79.0"
  - "oxlint@1.94.0"
  - "playwright-core@1.65.1"
  - "playwright@1.65.1"
  - "vite@8.3.8"
  - "wrangler@4.164.0"

overrides:
  hono: 4.13.16
  fflate: 0.8.3
  source-map-js: 1.2.2
  "zod@>=4 <5": 4.6.6
  tinypool: 2.1.2
